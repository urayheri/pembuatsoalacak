<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengacak Paket Soal - Asisten Guru Indonesia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-xs antialiased min-h-screen flex flex-col justify-between p-6">

    <div class="max-w-4xl mx-auto w-full space-y-4">
        <a href="index.html" class="inline-flex items-center gap-1 font-bold text-emerald-700 hover:underline">← Kembali ke Halaman Utama</a>
        
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs space-y-4">
            <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center gap-2">
                <span>📊</span> Mode 1: Pengacak Paket Soal Ujian
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border-2 border-dashed border-slate-300 p-6 rounded-xl text-center flex flex-col items-center justify-center">
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="w-full text-xs">
                    <span id="fileStatus" class="text-[10px] text-slate-400 mt-2">Format tabel data soal (.xlsx)</span>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block font-medium text-slate-600 mb-1">Jumlah Paket Soal Acak</label>
                        <select id="packetCount" class="w-full border border-slate-300 rounded-lg p-2">
                            <option value="2">2 Paket Berbeda (Paket A, Paket B)</option>
                            <option value="3">3 Paket Berbeda (Paket A, B, C)</option>
                        </select>
                    </div>

                    <button id="processAcakBtn" disabled class="w-full py-2.5 bg-emerald-600 disabled:bg-slate-200 text-white font-bold rounded-lg cursor-pointer">
                        📝 Acak & Ekspor ke ZIP
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SKRIP LOGIK DILAPISKAN LANGSUNG DALAM HTML -->
    <script>
        const excelInput = document.getElementById('excelInput');
        const fileStatus = document.getElementById('fileStatus');
        const processAcakBtn = document.getElementById('processAcakBtn');
        let rawQuestions = [];

        excelInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                rawQuestions = XLSX.utils.sheet_to_json(worksheet);

                fileStatus.textContent = `✓ ${file.name} terdeteksi (${rawQuestions.length} baris data).`;
                fileStatus.className = "text-[10px] text-emerald-600 font-bold mt-2";
                processAcakBtn.disabled = false;
            };
            reader.readAsArrayBuffer(file);
        });

        processAcakBtn.addEventListener('click', () => {
            alert(`Memproses ${rawQuestions.length} soal ke dalam paket acak...`);
            // Kode logika JS acak soal & JSZip dipanggil di sini
        });
    </script>
</body>
</html>
