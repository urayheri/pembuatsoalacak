<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perumus Modul Ajar - Asisten Guru Indonesia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-xs antialiased min-h-screen flex flex-col justify-between p-6">

    <div class="max-w-4xl mx-auto w-full space-y-4">
        <a href="index.html" class="inline-flex items-center gap-1 font-bold text-emerald-700 hover:underline">← Kembali ke Halaman Utama</a>
        
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs space-y-4">
            <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center gap-2">
                <span>📚</span> Mode 3: Perumus Modul Ajar Kurikulum Merdeka
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-medium mb-1">Nama Mata Pelajaran</label>
                    <input type="text" id="modulMapel" value="Pemrograman Web" class="w-full border border-slate-300 p-2 rounded-lg">
                </div>
                <div>
                    <label class="block font-medium mb-1">Topik Utama Pembahasan</label>
                    <input type="text" id="modulTopik" value="Sintaks Dasar HTML" class="w-full border border-slate-300 p-2 rounded-lg">
                </div>
            </div>

            <button id="processModulBtn" class="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-lg cursor-pointer">
                ✨ Susun Perangkat Ajar Bersama AI
            </button>
        </div>
    </div>

    <!-- SKRIP LOGIK MODUL AJAR INLINE -->
    <script>
        const processModulBtn = document.getElementById('processModulBtn');

        processModulBtn.addEventListener('click', () => {
            const mapel = document.getElementById('modulMapel').value;
            const topik = document.getElementById('modulTopik').value;
            
            alert(`Merumuskan Modul Ajar Kurikulum Merdeka untuk mata pelajaran ${mapel} - Topik: ${topik}`);
            // Logika permintaan ke AI Modul Ajar di sini
        });
    </script>
</body>
</html>
